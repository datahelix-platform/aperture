id: org.datahelix.aperture.control-plane
name: aperture_control_plane
version: 1.2.0
description: >-
  The Aperture control-plane document type: a Mosaic entity type for storing
  Aperture's own state (saved views, workflow drafts, config-as-data) as
  {kind, name, payload} documents, recognized structurally by the SPA
  (ADR-0032). Ships as a recipe so any Mosaic deployment can opt in without
  Aperture code changes; see aperture#17.

  v1.1.0 adds the optional `owner` and `visibility` attributes that make
  the store multi-tenant (ADR-0032 ownership amendment): upsert by
  (owner, kind, name), owner-only writes, shared-but-read-only views.
  Both are recognized optionally, so the upgrade is additive — a
  deployment on 1.0.0 keeps working, with per-user scoping not lit up.

  v1.2.0 follows Mosaic v0.16.0's identifier rename (platform ADR-0007):
  the schema imports `mosaic_core` and annotates `mosaic_index` instead of
  `hippo_core` / `hippo_index`, so it needs Mosaic >= 0.16.0. The document
  type itself is unchanged.
